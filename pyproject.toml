[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-experiments"
version = "0.1.0"
description = "Small experiments for understanding joint-embedding predictive architectures"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["jepa*"]

