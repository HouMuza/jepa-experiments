<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">A 32 by 32 image becomes 64 patch vectors</title>
  <desc id="desc">An image is divided into a grid of 4 by 4 pixel patches and each patch is flattened to 48 values.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-width="2"/></pattern>
  </defs>
  <rect width="1100" height="460" rx="18" fill="#fbfaf7"/>
  <text x="550" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">The image is rearranged into patches</text>
  <g transform="translate(70 105)">
    <rect width="240" height="240" rx="8" fill="#56b4a5" stroke="#172033" stroke-width="2"/>
    <rect width="240" height="240" fill="url(#grid)"/>
    <rect x="90" y="60" width="30" height="30" fill="#f3b33d" stroke="#172033" stroke-width="3"/>
    <text x="120" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">32 × 32 × 3</text>
    <text x="120" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">one RGB image</text>
  </g>
  <path d="M335 225H445" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="390" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">cut into</text>
  <text x="390" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">4 × 4 regions</text>
  <g transform="translate(475 115)" font-family="Arial, sans-serif">
    <g fill="#d8efe9" stroke="#56b4a5" stroke-width="2">
      <rect x="0" y="0" width="58" height="58" rx="5"/><rect x="66" y="0" width="58" height="58" rx="5"/><rect x="132" y="0" width="58" height="58" rx="5"/>
      <rect x="0" y="66" width="58" height="58" rx="5"/><rect x="66" y="66" width="58" height="58" rx="5"/><rect x="132" y="66" width="58" height="58" rx="5"/>
      <rect x="0" y="132" width="58" height="58" rx="5"/><rect x="66" y="132" width="58" height="58" rx="5"/><rect x="132" y="132" width="58" height="58" rx="5"/>
    </g>
    <text x="95" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">64 patches</text>
    <text x="95" y="250" text-anchor="middle" font-size="16" fill="#64748b">shown as a stack</text>
  </g>
  <path d="M690 225H795" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="742" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">flatten</text>
  <g transform="translate(825 100)" font-family="Arial, sans-serif">
    <rect width="205" height="250" rx="12" fill="#eee9fb" stroke="#7c3aed" stroke-width="2"/>
    <g fill="#7c3aed">
      <rect x="35" y="35" width="135" height="8" rx="4"/><rect x="35" y="55" width="96" height="8" rx="4"/><rect x="35" y="75" width="121" height="8" rx="4"/>
      <circle cx="102" cy="108" r="3"/><circle cx="102" cy="120" r="3"/><circle cx="102" cy="132" r="3"/>
      <rect x="35" y="153" width="115" height="8" rx="4"/><rect x="35" y="173" width="128" height="8" rx="4"/>
    </g>
    <text x="102" y="219" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">48 values</text>
    <text x="102" y="241" text-anchor="middle" font-size="15" fill="#64748b">inside each patch</text>
  </g>
  <text x="550" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">No information has been learned yet. We have only changed the arrangement.</text>
</svg>
