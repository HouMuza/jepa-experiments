<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#fbfbfd"/>
  <style>
    .title{font:700 32px Georgia,serif;fill:#101828}.label{font:600 19px Arial,sans-serif;fill:#172033}.small{font:16px Arial,sans-serif;fill:#475467}.box{stroke-width:2}.arrow{stroke:#344054;stroke-width:2.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/></marker></defs>
  <text x="55" y="58" class="title">Linear probe</text>
  <text x="55" y="88" class="small">Measure what a learned representation already makes easy to read.</text>
  <rect x="55" y="175" width="170" height="120" rx="14" fill="#eef4ff" stroke="#4e7ad9" class="box"/>
  <text x="140" y="225" text-anchor="middle" class="label">Image</text><text x="140" y="254" text-anchor="middle" class="small">32 × 32 × 3</text>
  <path d="M225 235 H315" class="arrow"/>
  <rect x="315" y="150" width="235" height="170" rx="14" fill="#edf7ff" stroke="#2583c5" class="box"/>
  <text x="432" y="208" text-anchor="middle" class="label">Frozen encoder</text><text x="432" y="241" text-anchor="middle" class="small">weights cannot change</text><text x="432" y="274" text-anchor="middle" class="small">no label gradients</text>
  <path d="M550 235 H640" class="arrow"/>
  <rect x="640" y="175" width="180" height="120" rx="14" fill="#f3efff" stroke="#7856c8" class="box"/>
  <text x="730" y="225" text-anchor="middle" class="label">Embedding</text><text x="730" y="254" text-anchor="middle" class="small">128 numbers</text>
  <path d="M820 235 H910" class="arrow"/>
  <rect x="910" y="150" width="235" height="170" rx="14" fill="#edf9f0" stroke="#3a9b5f" class="box"/>
  <text x="1027" y="204" text-anchor="middle" class="label">Linear classifier</text><text x="1027" y="237" text-anchor="middle" class="small">the only learned part</text><text x="1027" y="270" text-anchor="middle" class="small">10 class scores</text>
  <path d="M1027 320 V383" class="arrow"/>
  <rect x="842" y="383" width="305" height="76" rx="12" fill="#fff3f3" stroke="#d35b66" class="box"/>
  <text x="994" y="416" text-anchor="middle" class="label">Classification loss</text><text x="994" y="442" text-anchor="middle" class="small">updates the linear layer only</text>
  <path d="M842 421 H432 V325" stroke="#98a2b3" stroke-width="2" stroke-dasharray="8 7" fill="none"/>
  <text x="617" y="408" text-anchor="middle" class="small">gradient stops before encoder</text>
</svg>
