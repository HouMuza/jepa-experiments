<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Tiny JEPA architecture and gradient flow</title>
  <desc id="desc">A complete image goes through a target encoder updated by exponential moving average. A masked image goes through a context encoder and predictor. Hidden patch embeddings are compared.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs>
  <rect width="1120" height="500" rx="18" fill="#fbfaf7"/>
  <text x="560" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Experiment 03 predicts hidden embeddings</text>
  <g font-family="Arial, sans-serif">
    <rect x="50" y="90" width="170" height="84" rx="12" fill="#d8efe9" stroke="#56b4a5" stroke-width="2"/>
    <text x="135" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Complete image</text>
    <text x="135" y="150" text-anchor="middle" font-size="15" fill="#334155">all 64 patches</text>
    <path d="M240 132H330" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="355" y="82" width="210" height="100" rx="14" fill="#eee9fb" stroke="#7c3aed" stroke-width="2"/>
    <text x="460" y="121" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Target encoder</text>
    <text x="460" y="149" text-anchor="middle" font-size="15" fill="#7c3aed">EMA update · no gradients</text>
    <path d="M585 132H690" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="715" y="90" width="210" height="84" rx="12" fill="#eee9fb" stroke="#7c3aed" stroke-width="2"/>
    <text x="820" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Target vectors</text>
    <text x="820" y="150" text-anchor="middle" font-size="15" fill="#7c3aed">16 hidden positions</text>

    <rect x="50" y="300" width="170" height="84" rx="12" fill="#d8efe9" stroke="#56b4a5" stroke-width="2"/>
    <text x="135" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Masked image</text>
    <text x="135" y="360" text-anchor="middle" font-size="15" fill="#334155">16 mask tokens</text>
    <path d="M240 342H315" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="340" y="292" width="190" height="100" rx="14" fill="#f3b33d" stroke="#172033" stroke-width="2"/>
    <text x="435" y="331" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Context encoder</text>
    <text x="435" y="359" text-anchor="middle" font-size="15" fill="#5b4630">receives gradients</text>
    <path d="M550 342H625" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="650" y="292" width="170" height="100" rx="14" fill="#f3b33d" stroke="#172033" stroke-width="2"/>
    <text x="735" y="331" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Predictor</text>
    <text x="735" y="359" text-anchor="middle" font-size="15" fill="#5b4630">receives gradients</text>
    <path d="M840 342H930" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="955" y="300" width="125" height="84" rx="12" fill="#eee9fb" stroke="#7c3aed" stroke-width="2"/>
    <text x="1017" y="334" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Predicted</text>
    <text x="1017" y="359" text-anchor="middle" font-size="15" fill="#7c3aed">vectors</text>

    <path d="M820 190V232H955" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1017 285V252" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="900" y="205" width="180" height="62" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="990" y="231" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Embedding loss</text>
    <text x="990" y="252" text-anchor="middle" font-size="14" fill="#7f1d1d">hidden positions only</text>
    <path d="M460 275V205" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <text x="470" y="247" font-size="14" fill="#7c3aed">EMA follows context</text>
  </g>
</svg>
